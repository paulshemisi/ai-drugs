<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="410" viewBox="0 0 1230 410" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The four phases of AI D.R.U.G.S.</title>
<desc>An intensity curve rising during dosing, spiking during the trip, falling during the comedown, ending on a gold point for the gift, with four cards below.</desc>
<rect width="1230" height="410" fill="#0A0A0A"/>
<line x1="60" y1="200" x2="1170" y2="200" stroke="#C9A227" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.5"/>
<path d="M60 200 C 150 200 230 170 315 130 L 345 110 L 375 40 L 405 120 L 435 35 L 465 130 L 495 50 L 525 115 L 555 60 L 600 100 C 680 110 760 195 885 200 L 1042 200" fill="none" stroke="#C9A227" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1042" cy="200" r="14" fill="none" stroke="#C9A227" stroke-width="1.5"/>
<circle cx="1042" cy="200" r="7" fill="#C9A227"/>
<text x="1070" y="188" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">assert gift.passes()</text>
<text x="60" y="30" fill="#C9A227" font-family="'Courier New',monospace" font-size="12" letter-spacing="3">INTENSITY</text>
<rect x="60" y="240" width="255" height="140" fill="#141414" stroke="#C9A227" stroke-width="1.5"/>
<text x="80" y="275" fill="#C9A227" font-family="'Courier New',monospace" font-size="14">01</text>
<text x="80" y="305" fill="#F2EFE6" font-family="Georgia,serif" font-size="24" font-weight="700">Dosing</text>
<text x="80" y="335" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Raise temperature.</text>
<text x="80" y="355" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Widen the sampling.</text>
<rect x="345" y="240" width="255" height="140" fill="#141414" stroke="#C9A227" stroke-width="1.5"/>
<text x="365" y="275" fill="#C9A227" font-family="'Courier New',monospace" font-size="14">02</text>
<text x="365" y="305" fill="#F2EFE6" font-family="Georgia,serif" font-size="24" font-weight="700">The trip</text>
<text x="365" y="335" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Divergent generations.</text>
<text x="365" y="355" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Cross-domain leaps.</text>
<rect x="630" y="240" width="255" height="140" fill="#141414" stroke="#C9A227" stroke-width="1.5"/>
<text x="650" y="275" fill="#C9A227" font-family="'Courier New',monospace" font-size="14">03</text>
<text x="650" y="305" fill="#F2EFE6" font-family="Georgia,serif" font-size="24" font-weight="700">Comedown</text>
<text x="650" y="335" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Cool the decoding.</text>
<text x="650" y="355" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Prune noise and junk.</text>
<rect x="915" y="240" width="255" height="140" fill="#141414" stroke="#C9A227" stroke-width="2.5"/>
<text x="935" y="275" fill="#C9A227" font-family="'Courier New',monospace" font-size="14">04</text>
<text x="935" y="305" fill="#C9A227" font-family="Georgia,serif" font-size="24" font-weight="700">The gift</text>
<text x="935" y="335" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Extract the one idea.</text>
<text x="935" y="355" fill="#F2EFE6" font-family="'Courier New',monospace" font-size="13">Compile it. Test it.</text>
</svg>
